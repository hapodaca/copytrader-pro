version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: copytrader
      POSTGRES_USER: copytrader
      POSTGRES_PASSWORD: copytrader123
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U copytrader']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  api:
    build: ./apps/api
    ports: ['3001:3001']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    env_file: .env
    command: sh -c 'npx prisma migrate deploy --schema=src/db/prisma/schema.prisma && node dist/index.js'

  web:
    build: ./apps/web
    ports: ['3000:3000']
    depends_on: [api]
    environment:
      VITE_API_URL: http://localhost:3001

volumes:
  pgdata:
